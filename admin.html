<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin ON/OFF Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#f7f7f7; }
    .cardx{ background:#fff;border-radius:14px;border:1px solid #eee;padding:14px; }
    .nm{ font-weight:900;font-size:13px;margin:0; }
    .sub{ font-size:12px;color:#666;margin:0; }
    .pill{ font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;display:inline-block; }
    .on{ background:#e7ffe8;color:#0a7a12;border:1px solid #c9f5cc; }
    .off{ background:#ffe9e9;color:#a50f0f;border:1px solid #ffd0d0; }
    .rowx{ display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .btnx{ min-width:78px; }
    .muted{ color:#777; font-size:12px; }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width:760px;">
    <div class="cardx mb-3">
      <h5 class="mb-1" style="font-weight:900;">Admin ON/OFF Produk</h5>
      <div class="text-muted" style="font-size:13px;">Akses: <b>/admin.html</b> (host Vercel). Status disimpan di Upstash.</div>
      <hr>
      <div class="row g-2">
        <div class="col-12">
          <label class="form-label">Token API BukaOlshop</label>
          <input id="tokenapi" class="form-control" value="eyJhcHAiOiIxNjMwMTciLCJhdXRoIjoiMjAyNDA5MTAiLCJzaWduIjoiU2JmTEdJcTFpb0h1OVBTU3hqMzVPdz09In0=">
        </div>
        <div class="col-12">
          <label class="form-label">ID Kategori Utama Akrab (contoh 715335)</label>
          <input id="idKategori" class="form-control" value="715335">
          <div class="muted mt-1">Catatan: produk biasanya ada di <b>sub_kategori</b>. Script ini otomatis ambil semua sub_kategori (misal 2).</div>
        </div>
        <div class="col-12">
          <label class="form-label">Admin Key</label>
          <input id="adminKey" class="form-control" placeholder="Masukkan ADMIN_KEY (sama seperti env di Vercel)">
        </div>
        <div class="col-12 d-flex gap-2 mt-1">
          <button class="btn btn-primary w-100" onclick="loadAll()">Load Produk</button>
          <button class="btn btn-outline-secondary w-100" onclick="refreshStatus()">Refresh Status</button>
        </div>
      </div>
    </div>

    <div class="cardx mb-2">
      <input id="q" class="form-control" placeholder="Cari nama produk..." oninput="render()">
      <div class="muted mt-2">
        Total Produk: <b id="totalAll">0</b> • Ditampilkan: <b id="totalShown">0</b>
        <span id="subInfo" class="ms-2"></span>
      </div>
    </div>

    <div class="d-flex gap-2 mb-2">
      <button class="btn btn-sm btn-outline-danger w-100" onclick="setAll('OFF')">OFF Semua</button>
      <button class="btn btn-sm btn-outline-success w-100" onclick="setAll('ON')">ON Semua</button>
    </div>

    <div id="list" class="d-grid gap-2"></div>
  </div>

<script>
  const BASE = ""; // karena api & halaman sama-sama di Vercel

  let products = [];     // [{ nama_produk, ... }]
  let statusMap = {};    // { "nama produk normalized": "ON"/"OFF" }
  let subcats = [];      // sub_kategori yang dipakai

  function norm(s){ return (s||"").toString().toLowerCase().replace(/\s+/g," ").trim(); }

  async function safeJSON(resp){
    const ct = resp.headers.get("content-type") || "";
    const text = await resp.text();
    if(!ct.includes("application/json")){
      // biar errornya kebaca kalau server balikin HTML
      throw new Error("Respon bukan JSON: " + text.slice(0,120));
    }
    try { return JSON.parse(text); }
    catch(e){ throw new Error("JSON tidak valid: " + text.slice(0,120)); }
  }

  async function getJSON(url){
    const r = await fetch(url);
    const j = await safeJSON(r);
    if(!r.ok || j?.ok === false) throw new Error(j?.msg || j?.error || "Error");
    return j;
  }

  async function postJSON(url, body){
    const key = document.getElementById("adminKey").value.trim();
    if(!key) throw new Error("Admin Key wajib diisi");

    const r = await fetch(url, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key": key
      },
      body: JSON.stringify(body)
    });
    const j = await safeJSON(r);
    if(!r.ok || j?.ok === false) throw new Error(j?.msg || j?.error || "Error");
    return j;
  }

  function toast(msg, type="info"){
    const d = document.createElement("div");
    d.className = "alert alert-" + (type==="ok" ? "success" : type==="err" ? "danger" : "info") + " p-2";
    d.style.position="fixed"; d.style.right="12px"; d.style.top="12px"; d.style.zIndex=9999;
    d.style.fontSize="13px"; d.style.fontWeight="900";
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1400);
  }

  async function refreshStatus(){
    const res = await getJSON(BASE + "/api/list");
    statusMap = res.data || {};
    render();
    toast("Status di-refresh", "ok");
  }

  // Ambil subkategori dari kategori utama
  async function fetchSubcats(token, mainId){
    const cat = await getJSON("https://openapi.bukaolshop.net/v1/app/kategori?token=" + encodeURIComponent(token));
    const categories =
      (Array.isArray(cat.data) ? cat.data :
      (cat.data && Array.isArray(cat.data.data) ? cat.data.data : []));

    const main = categories.find(x => String(x.id_kategori) === String(mainId));
    const subs = (main && Array.isArray(main.sub_kategori)) ? main.sub_kategori : [];
    return subs;
  }

  async function fetchProductsByCategory(token, idKat){
    const url = "https://openapi.bukaolshop.net/v1/app/produk?token=" + encodeURIComponent(token)
      + "&id_kategori=" + encodeURIComponent(idKat)
      + "&total_data=200";
    const res = await getJSON(url);

    const arr =
      (Array.isArray(res.data) ? res.data :
      (res.data && Array.isArray(res.data.data) ? res.data.data : []));

    return arr;
  }

  async function loadAll(){
    try{
      const token = document.getElementById("tokenapi").value.trim();
      const mainId = document.getElementById("idKategori").value.trim();
      if(!token) return toast("Token API wajib diisi", "err");
      if(!mainId) return toast("ID Kategori wajib diisi", "err");

      // 1) Ambil subkategori
      subcats = await fetchSubcats(token, mainId);

      // Kalau gak ada subkategori, coba langsung ambil produk dari kategori utama
      let all = [];
      if(subcats.length === 0){
        all = await fetchProductsByCategory(token, mainId);
        document.getElementById("subInfo").textContent = "(tanpa sub_kategori)";
      } else {
        document.getElementById("subInfo").textContent = "(sub_kategori: " + subcats.length + ")";
        // 2) Ambil produk dari tiap subkategori (misal 2)
        for(const s of subcats){
          const pid = s.id_kategori;
          const arr = await fetchProductsByCategory(token, pid);
          all = all.concat(arr);
        }
      }

      // 3) Deduplicate by nama_produk normalized
      const map = new Map();
      for(const p of all){
        const n = norm(p?.nama_produk);
        if(!n) continue;
        if(!map.has(n)) map.set(n, p);
      }
      products = Array.from(map.values()).sort((a,b)=> (a.harga_produk||0) - (b.harga_produk||0));

      document.getElementById("totalAll").textContent = String(products.length);

      // 4) Refresh status dari Upstash biar tombol nyambung
      await refreshStatus();

      toast("Produk berhasil diload", "ok");
    }catch(e){
      toast(String(e.message || e), "err");
      console.error(e);
    }
  }

  function getStatusForProduct(p){
    const n = norm(p?.nama_produk);
    return (statusMap[n] || "ON").toString().toUpperCase();
  }

  async function setOne(p, status){
    const nama_produk = p?.nama_produk || "";
    await postJSON(BASE + "/api/set", { nama_produk, status });
    // update lokal biar UI langsung berubah
    statusMap[norm(nama_produk)] = status;
  }

  async function setAll(status){
    try{
      if(products.length === 0) return toast("Tidak ada data. Klik Load Produk dulu.", "err");

      toast("Proses " + status + " semua...", "info");

      // jalanin berurutan biar aman (kalau mau lebih cepat, bisa bikin parallel nanti)
      for(const p of products){
        await setOne(p, status);
      }

      render();
      toast("Berhasil " + status + " semua", "ok");
    }catch(e){
      toast(String(e.message || e), "err");
      console.error(e);
    }
  }

  function render(){
    const list = document.getElementById("list");
    const q = norm(document.getElementById("q").value);

    list.innerHTML = "";

    const filtered = products.filter(p => norm(p?.nama_produk).includes(q));
    document.getElementById("totalShown").textContent = String(filtered.length);

    if(filtered.length === 0){
      list.innerHTML = `<div class="text-muted">Tidak ada data. Klik <b>Load Produk</b> dulu.</div>`;
      return;
    }

    for(const p of filtered){
      const nm = p?.nama_produk || "-";
      const stat = getStatusForProduct(p); // ON/OFF

      const div = document.createElement("div");
      div.className = "cardx";

      div.innerHTML = `
        <div class="rowx">
          <div class="me-2" style="flex:1;">
            <p class="nm">${escapeHtml(nm)}</p>
            <p class="sub">${escapeHtml(p?.nama_kategori || "")}</p>
          </div>

          <div class="text-end" style="min-width:140px;">
            <div class="mb-2">
              <span class="pill ${stat==="ON" ? "on" : "off"}">${stat}</span>
            </div>
            <div class="d-flex gap-2 justify-content-end">
              <button class="btn btn-sm btn-outline-danger btnx" data-act="off">OFF</button>
              <button class="btn btn-sm btn-outline-success btnx" data-act="on">ON</button>
            </div>
          </div>
        </div>
      `;

      div.querySelector('[data-act="off"]').addEventListener("click", async ()=>{
        try{ await setOne(p, "OFF"); render(); toast("OFF: " + nm, "ok"); }
        catch(e){ toast(String(e.message||e), "err"); }
      });

      div.querySelector('[data-act="on"]').addEventListener("click", async ()=>{
        try{ await setOne(p, "ON"); render(); toast("ON: " + nm, "ok"); }
        catch(e){ toast(String(e.message||e), "err"); }
      });

      list.appendChild(div);
    }
  }

  function escapeHtml(s){
    return (s||"").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>
</body>
</html>

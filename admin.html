<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin ON/OFF Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#f7f7f7; }
    .cardx{ background:#fff;border-radius:14px;border:1px solid #eee;padding:14px; }
    .nm{ font-weight:900;font-size:13px;margin:0; }
    .sub{ font-size:12px;color:#666;margin:0; }
    .pill{ font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;display:inline-block; }
    .on{ background:#e7ffe8;color:#0a7a12;border:1px solid #c9f5cc; }
    .off{ background:#ffe9e9;color:#a50f0f;border:1px solid #ffd0d0; }
    .muted{ opacity:.65; pointer-events:none; }
    .switch{ transform: scale(1.1); }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width:760px;">
    <div class="cardx mb-3">
      <h5 class="mb-1" style="font-weight:900;">Admin ON/OFF Produk</h5>
      <div class="text-muted" style="font-size:13px;">Akses: <b>/admin.html</b> (host Vercel). Status disimpan di Upstash.</div>
      <hr>
      <div class="row g-2">
        <div class="col-12">
          <label class="form-label">Token API BukaOlshop</label>
          <input id="tokenapi" class="form-control"
            value="eyJhcHAiOiIxNjMwMTciLCJhdXRoIjoiMjAyNDA5MTAiLCJzaWduIjoiU2JmTEdJcTFpb0h1OVBTU3hqMzVPdz09In0=">
        </div>
        <div class="col-12">
          <label class="form-label">ID Kategori Akrab (contoh 715335)</label>
          <input id="idKategori" class="form-control" value="715335">
        </div>
        <div class="col-12">
          <label class="form-label">Admin Key</label>
          <input id="adminKey" class="form-control" placeholder="Isi ADMIN_KEY (harus sama dengan env di Vercel)">
        </div>
        <div class="col-12 d-flex gap-2 mt-1">
          <button id="btnLoad" class="btn btn-primary w-100" onclick="loadAll()">Load Produk</button>
          <button id="btnRefresh" class="btn btn-outline-secondary w-100" onclick="refreshStatus()">Refresh Status</button>
        </div>
      </div>
    </div>

    <div class="cardx mb-2">
      <input id="q" class="form-control" placeholder="Cari nama produk..." oninput="render()">
      <div class="text-muted mt-2" style="font-size:12px;">
        Total Produk: <b id="countProd">0</b> • Ditampilkan: <b id="countShown">0</b>
      </div>
    </div>

    <div class="d-flex gap-2 mb-2">
      <button id="btnOffAll" class="btn btn-sm btn-outline-danger w-100" onclick="setAll('OFF')">OFF Semua</button>
      <button id="btnOnAll" class="btn btn-sm btn-outline-success w-100" onclick="setAll('ON')">ON Semua</button>
    </div>

    <div id="list"></div>
  </div>

<script>
  const BASE = ""; // sama domain Vercel

  let products = [];     // [{nama_produk, harga_produk, id_produk, ...}]
  let statusMap = {};    // { "nama normalized": "ON"/"OFF" }

  function norm(s){ return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }

  function setBusy(busy){
    const ids = ["btnLoad","btnRefresh","btnOffAll","btnOnAll"];
    ids.forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.disabled = !!busy;
      el.classList.toggle("muted", !!busy);
    });
  }

  async function safeReadJSON(res){
    const text = await res.text();
    try { return JSON.parse(text); }
    catch(e){
      // kalau server balik HTML (misal error 502), biar pesannya kebaca
      throw new Error("Response bukan JSON: " + text.slice(0,120));
    }
  }

  async function getJSON(url){
    const r = await fetch(url, { cache: "no-store" });
    const j = await safeReadJSON(r);
    if(!r.ok || j?.ok === false) throw new Error(j?.msg || j?.error || "Error");
    return j;
  }

  async function postJSON(url, body){
    const key = document.getElementById("adminKey").value.trim();
    if(!key) throw new Error("Admin Key wajib diisi");

    const r = await fetch(url, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key": key
      },
      body: JSON.stringify(body)
    });
    const j = await safeReadJSON(r);
    if(!r.ok || j?.ok === false) throw new Error(j?.msg || j?.error || "Error");
    return j;
  }

  function toast(msg, type="info"){
    const d = document.createElement("div");
    d.className = "alert alert-" + type + " p-2";
    d.style.position="fixed"; d.style.right="12px"; d.style.top="12px"; d.style.zIndex=9999;
    d.style.fontSize="13px"; d.style.fontWeight="900";
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1400);
  }

  // ====== API Upstash status ======
  async function refreshStatus(){
    setBusy(true);
    try{
      const res = await getJSON(BASE + "/api/list");
      statusMap = res.data || {};
      render();
      toast("Status di-refresh", "info");
    }catch(e){
      alert("Gagal refresh: " + e.message);
    }finally{
      setBusy(false);
    }
  }

  // ====== Load produk dari BukaOlshop ======
  async function loadAll(){
    setBusy(true);
    try{
      const token = document.getElementById("tokenapi").value.trim();
      const idKategori = document.getElementById("idKategori").value.trim();
      if(!token) throw new Error("Token API wajib diisi");
      if(!idKategori) throw new Error("ID Kategori wajib diisi");

      // Ambil produk kategori (limit 200 biar aman)
      const url = `https://openapi.bukaolshop.net/v1/app/produk?token=${encodeURIComponent(token)}&total_data=200&id_kategori=${encodeURIComponent(idKategori)}`;
      const j = await getJSON(url);

      products = (j.data || []).filter(p => (p.nama_produk||"").trim().length > 0);
      // sort biar rapih
      products.sort((a,b)=> (a.nama_produk||"").localeCompare((b.nama_produk||""), "id"));

      document.getElementById("countProd").textContent = String(products.length);

      await refreshStatus();
      render();
      toast("Produk berhasil diload", "success");
    }catch(e){
      alert("Load Produk gagal: " + e.message);
    }finally{
      setBusy(false);
    }
  }

  // ====== Render list ======
  function render(){
    const q = document.getElementById("q").value.toLowerCase().trim();
    const wrap = document.getElementById("list");
    wrap.innerHTML = "";

    const shown = products.filter(p => (p.nama_produk||"").toLowerCase().includes(q));
    document.getElementById("countShown").textContent = String(shown.length);

    if(shown.length === 0){
      wrap.innerHTML = `<div class="text-muted" style="font-size:13px;">Tidak ada data. Klik <b>Load Produk</b> dulu.</div>`;
      return;
    }

    shown.forEach(p=>{
      const name = p.nama_produk || "";
      const key = norm(name);
      const st = (statusMap[key] || "ON").toUpperCase();
      const isOn = st === "ON";

      const row = document.createElement("div");
      row.className = "cardx mb-2";

      row.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <div class="w-100">
            <p class="nm">${escapeHtml(name)}</p>
            <p class="sub">Status: <span class="pill ${isOn?'on':'off'}">${isOn?'ON':'OFF'}</span></p>
          </div>
          <div class="form-check form-switch m-0">
            <input class="form-check-input switch" type="checkbox" ${isOn?'checked':''} data-name="${escapeAttr(name)}">
          </div>
        </div>
      `;

      const sw = row.querySelector("input[type=checkbox]");
      sw.addEventListener("change", async (ev)=>{
        const next = ev.target.checked ? "ON" : "OFF";
        // optimis update UI dulu
        statusMap[key] = next;
        render();
        try{
          await postJSON(BASE + "/api/set", { nama_produk: name, status: next });
          toast(`${next} • ${name}`, "success");
        }catch(e){
          // rollback kalau gagal
          statusMap[key] = isOn ? "ON" : "OFF";
          render();
          alert("Gagal update: " + e.message);
        }
      });

      wrap.appendChild(row);
    });
  }

  // ====== ON/OFF semua ======
  async function setAll(status){
    if(products.length === 0){
      alert("Produk kosong. Klik Load Produk dulu.");
      return;
    }
    const ok = confirm(`${status} semua produk?`);
    if(!ok) return;

    setBusy(true);
    try{
      // proses satu-satu biar aman (anti rate limit)
      for(const p of products){
        const name = p.nama_produk || "";
        if(!name) continue;

        const key = norm(name);
        statusMap[key] = status; // update UI
        render();

        await postJSON(BASE + "/api/set", { nama_produk: name, status });
      }
      await refreshStatus();
      toast(`${status} semua berhasil`, "success");
    }catch(e){
      alert("Gagal setAll: " + e.message);
    }finally{
      setBusy(false);
    }
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

  // auto render kosong awal
  render();
</script>
</body>
</html>
